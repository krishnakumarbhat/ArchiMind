[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F541", "F841", "I"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
show_error_codes = true
[[tool.mypy.overrides]]
module = ["services", "app", "worker", "models", "auth", "oauth_utils"]
ignore_errors = false
disallow_untyped_defs = true
