services:
  web:
    image: ${ARCHIMIND_IMAGE:-krishnah27/archimind:latest}
    container_name: archimind_web
    env_file: .env
    restart: always
    ports:
      - "80:5000"
    volumes:
      - archimind_data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/archimind_dev.db}
      - VECTOR_BACKEND=${VECTOR_BACKEND:-local}
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
    command: ["gunicorn", "app:create_app()", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "300", "--graceful-timeout", "30", "--access-logfile", "-", "--error-logfile", "-"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/status', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  archimind_data:
